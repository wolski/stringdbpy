[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "string-gsea"
version = "0.1.2"
description = "Submit STRING-DB enrichment analyses and package reproducible GSEA results."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = []
authors = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "anndata>=0.13.3.post0",
    "cyclopts",
    "fastexcel[pyarrow,polars]",
    "loguru",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "polars",
    "pyexcelerate",
    "pyyaml",
    "requests",
    "snakemake",
    "tomli-w",
]

[project.scripts]
string_gsea_write_config = "string_gsea.config_cli:app"
string_gsea_run = "string_gsea.gsea_cli:app"
string_ora_run = "string_gsea.ora_cli:app"
string_gsea_workflow = "string_gsea.workflow_cli:workflow_app"
_string_gsea_render = "string_gsea.workflow_cli:render_report_app"
_string_gsea_render_only = "string_gsea.workflow_cli:render_only_app"
_string_gsea_package = "string_gsea.workflow_cli:package_results_app"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "deptry>=0.24,<1",
    "import-linter>=2,<3",
    "jsonschema>=4,<5",
    "pre-commit>=4,<5",
    "pyright>=1.1.400,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-mock>=3.15,<4",
    "ruff>=0.15,<1",
    "twine>=6,<7",
    "types-pyyaml>=6,<7",
    "types-requests>=2,<3",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "C90",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PGH",
    "PIE",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportImportCycles = "error"
reportMissingTypeStubs = "none"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
enableTypeIgnoreComments = false

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra", "-m", "not integration and not smoke"]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: full workflow tests on all CI datasets (STRING-DB + Quarto + R)",
    "smoke: quick single-dataset workflow test (yeast RNK, about 4 MB)",
]

[tool.coverage.run]
branch = true
source = ["string_gsea"]
omit = ["src/string_gsea/__about__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.deptry]
known_first_party = ["string_gsea"]
exclude = [
    "docs",
    "docker",
    "scripts",
    "stringGSEAplot",
    "tests",
    "venv",
    "[.]venv",
    "[.]direnv",
    "[.]git",
]
package_module_name_map = { pyyaml = "yaml", tomli-w = "tomli_w" }

[tool.deptry.per_rule_ignores]
# Polars loads fastexcel for read_excel(), and the workflow launches Snakemake
# through its console executable, so neither dependency has a direct import.
DEP002 = ["fastexcel", "snakemake"]

[tool.importlinter]
root_package = "string_gsea"

[[tool.importlinter.contracts]]
name = "root composition points inward into independent feature packages"
type = "layers"
containers = ["string_gsea"]
exhaustive = true
layers = [
    "config_cli | gsea_cli | ora_cli | workflow_cli",
    "stringdb_adapters",
    "__about__ | configuration | gsea | ora | taxonomy | workflow",
]

[[tool.importlinter.contracts]]
name = "GSEA application and adapters depend inward on the model"
type = "layers"
containers = ["string_gsea.gsea"]
exhaustive = true
layers = [
    "application",
    "output",
    "input | ports | result_processing | session_yaml",
    "dea_artifact",
    "model",
]

[[tool.importlinter.contracts]]
name = "GSEA model enrichment depends on independent rank and session values"
type = "layers"
containers = ["string_gsea.gsea.model"]
exhaustive = true
layers = ["enrichment", "ranks | session", "json_boundary"]

[[tool.importlinter.contracts]]
name = "ORA application depends on independent ports and output"
type = "layers"
containers = ["string_gsea.ora"]
exhaustive = true
layers = ["application", "output | ports", "model"]

[[tool.importlinter.contracts]]
name = "taxonomy policies depend inward on ports"
type = "layers"
containers = ["string_gsea.taxonomy"]
exhaustive = true
layers = ["application | stringdb", "fasta | ports"]

[[tool.importlinter.contracts]]
name = "workflow rendering depends on template values"
type = "layers"
containers = ["string_gsea.workflow"]
exhaustive = true
layers = ["rendering", "packaging | templates"]
