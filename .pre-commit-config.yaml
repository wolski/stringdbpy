default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: .venv/bin/ruff check --fix
        language: system
        files: ^(src|tests)/
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: .venv/bin/ruff format
        language: system
        files: ^(src|tests)/
        types: [python]
      - id: pyright
        name: Pyright strict
        entry: .venv/bin/pyright
        language: system
        pass_filenames: false
      - id: import-linter
        name: Directed package imports
        entry: .venv/bin/lint-imports
        language: system
        pass_filenames: false
      - id: deptry
        name: Dependency declarations
        entry: .venv/bin/deptry .
        language: system
        pass_filenames: false
      - id: pytest
        name: Pytest with branch coverage
        entry: .venv/bin/pytest --cov --cov-branch
        language: system
        pass_filenames: false
        stages: [pre-push]
